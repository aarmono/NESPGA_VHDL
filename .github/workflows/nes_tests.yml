name: NES tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A full run takes hours; cancel it when newer commits are pushed to the
# same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nes-tests:
    name: NES tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add or remove entries to change the number of shards. Tests in
        # nes_tests.txt are distributed between shards automatically by
        # run time (see run_nes_tests.sh -s)
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build GHDL image
        run: board/sim/ghdl/build_ghdl_image.sh

      - name: List tests
        working-directory: board/sim/ghdl
        run: ./run_nes_tests.sh -l -s ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Run tests
        working-directory: board/sim/ghdl
        run: ./run_ghdl.sh ./run_nes_tests.sh -s ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nes-test-results-shard-${{ matrix.shard }}
          path: board/sim/ghdl/output/results.txt
          if-no-files-found: ignore

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nes-test-failures-shard-${{ matrix.shard }}
          path: board/sim/ghdl/output/failures/
          if-no-files-found: ignore

  # Combines the results of all shards into a single table in the job summary
  summary:
    name: NES test summary
    needs: nes-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: nes-test-results-shard-*
          path: results

      - name: Write job summary
        working-directory: board/sim/ghdl
        run: |
          ./run_nes_tests.sh -r "$GITHUB_WORKSPACE"/results/*/results.txt \
            >> "$GITHUB_STEP_SUMMARY"

  # Smoke tests of the DE1 board interop (SD card, SDRAM, SRAM, VGA, audio)
  # from nes_de1_tests.txt. nes_de1_bench is ~5.5x slower than nes_bench, so
  # only a few short tests are run
  nes-de1-tests:
    name: NES DE1 smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build GHDL image
        run: board/sim/ghdl/build_ghdl_image.sh

      - name: List tests
        working-directory: board/sim/ghdl
        run: ./run_nes_tests.sh -l -b nes_de1_bench

      - name: Run tests
        working-directory: board/sim/ghdl
        run: ./run_ghdl.sh ./run_nes_tests.sh -b nes_de1_bench

      - name: Write job summary
        if: ${{ !cancelled() }}
        working-directory: board/sim/ghdl
        run: |
          ./run_nes_tests.sh -b nes_de1_bench -r de1_output/results.txt \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nes-de1-test-failures
          path: board/sim/ghdl/de1_output/failures/
          if-no-files-found: ignore

  # Smoke tests of the SD card menu (ROM_SD_MENU) on nes_de1_bench from
  # sd_menu_tests.txt: boot the menu from a FAT card, launch a test ROM from
  # it and check the game's screen. The cards are made on the runner, since
  # the GHDL image has no cc65 or mtools
  sd-menu-smoke:
    name: SD menu smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cc65 dosfstools mtools

      - name: Make the cards
        working-directory: board/de1/sd_menu
        run: make smoke_card.img

      - name: Build GHDL image
        run: board/sim/ghdl/build_ghdl_image.sh

      - name: Run tests
        working-directory: board/sim/ghdl
        run: |
          ./run_ghdl.sh ./run_nes_tests.sh -b nes_de1_bench \
            -f sd_menu_tests.txt -o sd_menu_output

      - name: Write job summary
        if: ${{ !cancelled() }}
        working-directory: board/sim/ghdl
        run: |
          ./run_nes_tests.sh -b nes_de1_bench -f sd_menu_tests.txt \
            -r sd_menu_output/results.txt >> "$GITHUB_STEP_SUMMARY"

      # The frames too, since a failure can be anywhere from the stub to the
      # game
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sd-menu-smoke-failures
          path: |
            board/sim/ghdl/sd_menu_output/failures/
            board/sim/ghdl/sd_menu_output/**/frame_*.bmp
          if-no-files-found: ignore
