# The stub is the top 2 KB of a 16 KB NROM PRG ROM. sd_menu pads the rest
MEMORY
{
    ZP:  start = $0000, size = $0100, type = rw;
    ROM: start = $F800, size = $0800, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS
{
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = ROM, type = ro;
    VECTORS:  load = ROM, type = ro, start = $FFFA;
}
